  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #020810;
      color: hsl(0 0% 100%);
      font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      overflow-x: hidden;
    }
    #vanta-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100dvh;
      background: #020810;
      pointer-events: none;
      overflow: hidden;
    }
    #vanta-bg canvas {
      display: block !important;
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      max-width: none !important;
      max-height: none !important;
    }
    .space-twinkle {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.42;
      mix-blend-mode: screen;
      background-image:
        radial-gradient(1.2px 1.2px at 6% 12%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1px 1px at 14% 38%, rgba(160,210,255,0.45), transparent),
        radial-gradient(1.4px 1.4px at 22% 18%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 28% 44%, rgba(180,220,255,0.4), transparent),
        radial-gradient(1.5px 1.5px at 18% 62%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 72% 24%, rgba(150,200,255,0.28), transparent),
        radial-gradient(1.2px 1.2px at 80% 48%, rgba(255,255,255,0.28), transparent),
        radial-gradient(1px 1px at 94% 18%, rgba(255,255,255,0.25), transparent);
    }
    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(216 30% 10%);
      border: 1px solid hsl(213 40% 32%);
      color: hsl(213 80% 80%);
    }
    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: hsl(213 75% 68%);
      margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(1.75rem, 5vw, 1.95rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: hsl(0 0% 100%);
      margin-bottom: 10px;
    }
    .sub {
      font-size: 0.9rem;
      line-height: 1.55;
      color: hsl(216 15% 72%);
      max-width: 34ch;
      margin-bottom: 22px;
    }
    .widget-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
      min-height: 52px;
    }
    cap-widget {
      --cap-background: hsl(216 30% 10%);
      --cap-border-color: hsl(213 40% 28%);
      --cap-border-radius: 12px;
      --cap-color: hsl(0 0% 96%);
      --cap-checkbox-background: hsl(216 28% 12%);
      --cap-checkbox-border: 1px solid hsl(213 40% 30%);
      --cap-spinner-color: hsl(213 75% 68%);
      --cap-spinner-background-color: hsl(213 40% 30% / 0.35);
      --cap-font: inherit;
      --cap-widget-width: 260px;
    }
    .agree {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      max-width: 320px;
      margin: 0 auto 18px;
      cursor: pointer;
      user-select: none;
    }
    .agree input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .tick {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      flex-shrink: 0;
      border-radius: 5px;
      border: 1px solid hsl(213 40% 34%);
      background: hsl(216 30% 10%);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .tick svg {
      width: 11px;
      height: 11px;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.12s, transform 0.12s;
      color: #fff;
    }
    .agree input:checked + .tick {
      background: hsl(213 55% 32%);
      border-color: hsl(213 45% 42%);
    }
    .agree input:checked + .tick svg { opacity: 1; transform: scale(1); }
    .agree input:focus-visible + .tick {
      outline: 2px solid hsla(213, 70%, 58%, 0.55);
      outline-offset: 2px;
    }
    .agree-text {
      font-size: 0.78rem;
      line-height: 1.45;
      color: hsl(216 15% 68%);
    }
    .agree-text a {
      color: hsl(213 75% 68%);
      text-decoration: none;
    }
    .agree-text a:hover { text-decoration: underline; }
    .continue {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
      padding: 12px 28px;
      border-radius: 12px;
      border: 1px solid hsl(213 45% 42%);
      background: hsl(213 55% 32%);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, filter 0.15s;
    }
    .continue:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .continue:not(:disabled):hover { filter: brightness(1.08); }
    .status {
      font-size: 0.75rem;
      color: hsl(216 15% 58%);
      min-height: 1.2em;
      margin-top: 14px;
    }
    .status.ok { color: #7ddea8; }
    .status.err { color: #f0a0a8; }
    .foot {
      margin-top: 18px;
      font-size: 11px;
      color: hsl(216 15% 52%);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .foot svg { flex-shrink: 0; opacity: 0.8; }

        data-cap-i18n-initial-state="I'm not a robot"

        <a href="/terms" target="_blank" rel="noopener">Terms</a>,
        <a href="/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a>, and
        <a href="/dmca" target="_blank" rel="noopener">DMCA Policy</a>.
      </span>
    </label>
    <button type="button" class="continue" id="continue" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>

      Continue

  <script type="module">
    const status = document.getElementById("status");
    const el = document.getElementById("cap");
    const agree = document.getElementById("agree");
    const btn = document.getElementById("continue");
    let solved = false;
    let busy = false;
    let legalVersion = null;

    function sync() {
      btn.disabled = busy || !solved || !agree.checked;
    }

    async function refreshStatus() {
      try {
        const r = await fetch("/api/legal/status", { credentials: "include" });
        const d = await r.json();
        legalVersion = d.version || null;
        if (d.gate) solved = true;
        if (d.gate && d.accepted) {
          status.textContent = "You're in — redirecting…";
          status.className = "status ok";
          location.replace("/");
          return;
        }
        if (d.gate && !d.accepted) {
          status.textContent = "Verified. Accept the policies to continue.";
          status.className = "status";
        }
        sync();
      } catch {}
    }

    async function continueOn() {
      if (busy || !solved || !agree.checked) return;
      busy = true;
      sync();
      status.textContent = "Saving agreement…";
      status.className = "status";
      try {
        const r = await fetch("/api/legal/accept", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ accepted: true, version: legalVersion }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          status.textContent = d.error || "Could not save agreement. Try again.";
          status.className = "status err";
          busy = false;
          sync();
          return;
        }
        status.textContent = "You're in — redirecting…";
        status.className = "status ok";
        setTimeout(() => { location.replace("/"); }, 250);
      } catch {
        status.textContent = "Network error. Please try again.";
        status.className = "status err";
        busy = false;
        sync();
      }
    }

    agree.addEventListener("change", sync);
    btn.addEventListener("click", continueOn);

    el.addEventListener("solve", () => {
      solved = true;
      status.textContent = agree.checked
        ? "Verified. Click Continue."
        : "Verified. Accept the policies, then Continue.";
      status.className = "status ok";
      sync();
    });
    el.addEventListener("error", (e) => {
      solved = false;
      status.textContent = e.detail?.message || "Verification failed. Please try again.";
      status.className = "status err";
      sync();
    });

    refreshStatus();
    sync();
  </script>
